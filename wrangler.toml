# SaaS 版配置
# 生产部署前：
#   1. SSO_BASE_DOMAIN 换成真实域名，并加通配符自定义域：
#      routes = [{ pattern = "*.sso.<你的域名>", custom_domain = true }]
#   2. wrangler d1 create dingtalk-saas → 把 database_id 填进来
#   3. wrangler d1 execute DB --remote --file=schema.sql
#   4. wrangler secret put ENCRYPTION_KEY / ADMIN_TOKEN / STATE_SECRET

name = "dingtalk-cfzt-saas"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# 租户子域名根域：<slug>.<SSO_BASE_DOMAIN> 解析为该租户的 issuer
SSO_BASE_DOMAIN = "sso.example.com"
# 钉钉 API 基址（测试时被 mock 覆盖）
DT_API_BASE = "https://api.dingtalk.com"
DT_LOGIN_BASE = "https://login.dingtalk.com"
# 本地开发默认租户（仅 hostname 为 localhost 时生效）
DEV_TENANT = "demo"

[[d1_databases]]
binding = "DB"
database_name = "dingtalk-saas"
database_id = "PLACEHOLDER_RUN_wrangler_d1_create"
